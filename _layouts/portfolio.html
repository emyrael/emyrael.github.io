<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <meta name="author" content="Emmanuel Onwubuya">
    <meta name="keywords" content="Forward Deployed Engineer, Senior AI Engineer, AI Engineer, Applied AI, LLM Engineer, RAG, LangGraph, Data Engineer, Databricks, FastAPI, Python, AI Platform Engineer">
    <meta name="theme-color" content="#060b12">
    <meta name="color-scheme" content="dark">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Emmanuel Onwubuya">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
  </head>
  <body class="portfolio-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include portfolio/nav.html %}
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <a class="footer-mark" href="#top" aria-label="Back to the top">EO</a>
        <p>Engineering AI systems that hold up outside the demo.</p>
        <p class="footer-meta">&copy; <span data-current-year>2026</span> Emmanuel Onwubuya</p>
      </div>
    </footer>
  </body>
</html>
